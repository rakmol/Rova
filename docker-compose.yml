services:
  postgis:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: rova
      POSTGRES_USER: rova
      POSTGRES_PASSWORD: rova_local_only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./apps/api/db:/rova-db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rova -d rova"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgis-data:
