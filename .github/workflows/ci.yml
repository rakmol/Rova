name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.profile || 'checks' }}
  cancel-in-progress: true
env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  EXPO_NO_DOTENV: '1'
  TZ: Africa/Accra
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-repo-hygiene.mjs
      - name: Install verified Gitleaks CLI (no paid action licence)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan complete reachable Git history, with redacted evidence
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git . --config .gitleaks.toml --redact=100 --report-format json --report-path secret-scan.json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: redacted-secret-scan
          path: secret-scan.json
          retention-days: 7
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-toolchain.mjs
      - run: npm run ci:policy
      - run: npm run ci:config
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run qa:check
      - run: npm run build
      - name: Compile Android JavaScript (not a signed APK or device test)
        working-directory: apps/mobile
        run: npx --no-install expo export --platform android --output-dir ../../qa/evidence/ci-android-bundle --max-workers 2
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test --workspace @rova/api
        env:
          TEST_DATABASE_URL: ''
      - run: npm run test --workspace @rova/mobile -- --testTimeout=30000
      - run: node --test qa/acceptance.test.mjs
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgis:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: rova
          POSTGRES_PASSWORD: rova_local_only
          POSTGRES_DB: rova_test_ci
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U rova -d rova_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Real disposable PostGIS migrations and integration contracts
        run: npm run test:db --workspace @rova/api
        env:
          TEST_DATABASE_URL: postgres://rova:rova_local_only@127.0.0.1:54329/rova_test_ci
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: apps/admin
      - run: npm run test:e2e --workspace @rova/admin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: isolated-browser-failure
          path: apps/admin/test-results/
          retention-days: 7
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit full dependency tree; block High/Critical and registry errors
        shell: bash
        run: |
          set +e
          npm audit --json --audit-level=high > dependency-audit.json
          status=$?
          set -e
          node scripts/check-dependency-audit.mjs dependency-audit.json
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
          retention-days: 14
