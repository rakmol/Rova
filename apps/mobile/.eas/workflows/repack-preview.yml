# Manual QA-only repack. Compare the current native fingerprint with this source
# build before running. Use a full build when native/config dependencies differ.
name: Repack reviewed ROVA preview
jobs:
  preview:
    type: repack
    environment: preview
    env:
      ROVA_APP_VARIANT: preview
    params:
      build_id: fab792c1-da23-4d42-8366-61f177967456
      profile: preview
      # Preserve the native build's remotely assigned Android versionCode.
      # Rewriting native metadata would restore the local minimum (4).
      js_bundle_only: true
      message: "Preview: contribution reporting and approved pins, search back and stable home menu"
